<style>

    font-weight:600; line-height:1.85; font-size:17px;

  }
  .wrap{max-width:560px; margin:0 auto; padding:24px 18px 56px;}

  /* ヘッダー */
  .head{text-align:center; padding:14px 0 12px;}
  .emblem{
    width:54px; height:54px; margin:0 auto 10px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:28px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(19,143,130,.28);
  }
  .brand{font-size:15px; font-weight:700; letter-spacing:.04em; color:var(--accentDark);}
  .title{font-size:27px; font-weight:800; margin:8px 0 6px; line-height:1.45;}
  .sub{font-size:15px; font-weight:600; color:var(--sub); line-height:1.8;}

  /* 進捗 */
  .progress{display:flex; gap:7px; justify-content:center; margin:18px 0 6px;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--line);}

  .step-label{text-align:center; font-size:14px; font-weight:700; color:var(--accentDark); margin-bottom:14px;}

    border:1px solid var(--line); box-shadow:0 6px 22px rgba(20,40,55,.06);
  }
  .q-title{font-size:23px; font-weight:800; line-height:1.5; margin:0 0 12px;}

    display:flex; align-items:center; gap:13px;

  textarea{
    width:100%; min-height:130px; resize:vertical;

    font-family:inherit; font-size:18px; font-weight:600; line-height:1.8; color:var(--text); background:var(--chipbg);
  }
  textarea:focus{outline:none; border-color:var(--accent);}
  .mic{
    margin-top:12px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    border:2px solid var(--accent); background:#fff; color:var(--accentDark);
    border-radius:13px; padding:14px; font-size:17px; font-weight:800; cursor:pointer;
  }
  .mic.rec{background:#FDE9E5; border-color:#C0563F; color:#A8402C;}
  .mic-hint{font-size:17px; font-weight:800; color:var(--accentDark); text-align:center; margin-top:12px; background:var(--selbg); border:1.5px solid var(--accent); border-radius:12px; padding:13px 12px; line-height:1.7;}

  .btn{flex:1; border:none; border-radius:13px; padding:17px; font-size:18px; font-weight:800; cursor:pointer; font-family:inherit;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.primary:disabled{background:#BBD3CF; cursor:not-allowed;}
  .btn.ghost{background:#fff; color:var(--accentDark); border:2px solid var(--line); flex:0 0 38%;}

  /* 結果 */
  .result-box{background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px 18px; box-shadow:0 6px 22px rgba(20,40,55,.06);}
  .result-lead{font-size:16px; font-weight:600; color:var(--sub); margin:0 0 14px; line-height:1.8;}
  .result-text{font-size:19px; font-weight:600; line-height:2.0; white-space:pre-wrap; background:var(--chipbg); border-radius:13px; padding:18px; color:var(--text);}
  .regen{margin-top:14px; width:100%; background:#fff; color:var(--accentDark); border:2px solid var(--line); border-radius:13px; padding:14px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;}
  .copy{margin-top:14px; width:100%; background:var(--accentDark); color:#fff; border:none; border-radius:13px; padding:17px; font-size:19px; font-weight:800; cursor:pointer; font-family:inherit;}
  .copy.done{background:#1B9E72;}
  .goto{margin-top:12px; width:100%; border-radius:13px; padding:16px; font-size:18px; font-weight:800; cursor:pointer; font-family:inherit; display:block; text-align:center; text-decoration:none;}
  .goto.main{background:var(--accent); color:#fff; border:none; font-size:19px; padding:18px;}
  .goto.hp{background:#D2752E;}
  .goto-note{font-size:14px; font-weight:700; color:var(--sub); text-align:center; margin-top:12px;}
  .steps-after{font-size:15px; font-weight:600; color:var(--sub); margin:18px 4px 0; line-height:1.95;}
  .steps-after b{color:var(--accentDark);}

  .foot{text-align:center; font-size:12px; font-weight:600; color:var(--sub); margin-top:34px; line-height:1.8;}
  .hidden{display:none;}
</style>
</head>

/* ===== 文章生成（2026-11-13 自然化）=====
   方針：①選んだ答えを「〜こと」で名詞化して並べない ②毎回すべての要素を入れない
   ③選んでいない事実（年数・半信半疑など）を足さない ④本人の一言を主役にする */
const BANNED=/(完治|治る|治ります|治った|必ず治|改善します|改善する|改善され)/g;
const WOE={ "歩くと痛い":["少し歩くのもしんどくて","歩くのがつらくて"], "階段の上り下りがつらい":["階段の上り下りがつらくて","階段がとにかくつらくて"], "立ち上がるときに痛い":["立ち上がるのがつらくて"], "動き始めに痛い":["特に動き始めがつらくて"], "ずっと立っていると痛い":["長く立っているのもつらくて"], "正座ができない":["正座もできなくて"], "膝の曲げ伸ばしで痛む":["曲げ伸ばしもつらくて"], "膝に水がたまる・腫れる":["水がたまって腫れることもあって"], "O脚が気になる":["O脚も気になっていて"], "変形性膝関節症と診断された":["病院では変形性膝関節症と言われて"], "病院で「年のせい」と言われた":["病院では年のせいと言われて"], "他の病院・治療院でよくならなかった":["どこに行ってもなかなか良くならなくて","あちこち行ってもあまり変わらなくて"], "手術を勧められている・避けたい":["手術も勧められていて"], "その他":["ずっと調子が悪くて"] };
const PRIOR={ "電気をあてていた":"電気をあてたり", "湿布をしていた":"湿布を貼ったり", "痛み止めを飲んでいた":"痛み止めを飲んだり", "注射を打っていた":"注射を打ったり", "ヒアルロン酸注射を打っていた":"ヒアルロン酸の注射を打ったり", "サポーターをつけていた":"サポーターをつけたり", "整形外科に通っていた":"整形外科に通ったり", "整骨院・マッサージに通っていた":"整骨院やマッサージに行ったり", "その他":"いろいろ試したり" };
const TREAT={ "膝の専門施術（手技）":["施術してもらって"], "膝を伸ばすための施術":["膝を伸ばす施術をしてもらって"], "膝のねじれ・バランスの調整":["膝のねじれを整えてもらって"], "お皿まわりの施術":["お皿のまわりを施術してもらって"], "膝を強くするトレーニング":["膝のトレーニングも教えてもらって"], "痛みの原因の検査・説明":["まず痛みの原因を調べて説明してもらって"], "自分でできるセルフケアの指導":["家でできるケアも教えてもらって"], "歩き方・体の使い方のアドバイス":["歩き方のアドバイスももらって"], "食事・栄養のアドバイス":["食事のアドバイスももらって"], "体質を整える腸活の指導":["腸活の指導も受けて"], "その他":["施術してもらって"] };
const CHANGE={ "痛みがやわらいだ":["痛みがだいぶやわらいできました","痛みがやわらいできました"], "歩くのがラクになった":["歩くのがラクになりました"], "階段がラクになった":["階段がラクになってきました"], "立ち上がりがラクになった":["立ち上がるのがラクになりました"], "膝の曲げ伸ばしがしやすくなった":["曲げ伸ばしがしやすくなりました"], "正座に近づいた・できるようになった":["正座が少しずつできるようになってきました"], "腫れ・水がひいてきた":["腫れが引いてきました"], "外出や旅行ができるようになった":["出かけるのが楽しくなりました","外出を楽しめるようになりました"], "スポーツ・趣味を楽しめるようになった":["趣味を楽しめるようになってきました"], "気持ちが前向きになった":["気持ちが前向きになりました"], "その他":["体が少しずつラクになってきました"] };
const GOOD={ "膝の痛みの原因をはじめて理解できた":["なぜ痛いのか、はじめてちゃんと分かりました","痛みの原因をはじめて理解できました"], "自分でできるケアを教えてもらえた":["家でできるケアを教えてもらえるので助かっています"], "説明が丁寧でわかりやすい":["説明が丁寧で分かりやすいです","毎回説明が分かりやすくて納得できます"], "体の状態をしっかり検査してくれた":["体の状態をしっかり見てくれます"], "痛くない施術で安心":["施術は痛くないので安心です"], "井上院長の対応が親切・丁寧":["井上先生がとても親切で話しやすいです","先生が親身に話を聞いてくれます"], "予約が取りやすい":["予約が取りやすいです"], "通いやすい立地":["駅から近くて通いやすいです"], "あきらめていたけど希望が持てた":["あきらめかけていましたが、希望が持てました"] };
CHANGE["まわりから歩き方が変わったと言われた"]=["まわりからも、歩き方が軽くなったねと言われるようになりました"];
CHANGE["夜、痛みで目が覚めにくくなった"]=["夜、痛みで目が覚めることも減りました"];
GOOD["絵や図を見せながら説明してくれた"]=["絵を見せながら説明してくれるので、自分の膝がどうなっているのかよく分かります","図を使って説明してもらえて、納得できました"];
GOOD["毎回、家でやる宿題がある"]=["毎回、家でやる宿題が出るので、自分でもケアするようになりました"];
GOOD["変化を毎回いっしょに確認してくれる"]=["次に行ったとき、どれくらい変わったか一緒に確認してくれるので励みになります"];
const FOUND={ "Instagram・SNSで見かけた":["SNSでこちらを見かけました。","インスタでこちらを見つけました。"], "ネットで検索して見つけた":["ネットで調べていて、こちらを見つけました。"], "チラシを見た":["ポストに入っていたチラシで知りました。"], "知り合い・家族のすすめ":["知り合いにすすめてもらいました。"], "近くだったので":["家から近かったので、行ってみました。"], "その他":[""] };
const FEEL={ "正直、半信半疑だった":["正直、最初は半信半疑でした。"], "少し不安だった":["最初は少し不安でした。"], "わらにもすがる思いだった":["わらにもすがる思いで行きました。"], "話だけでも聞いてみようと思った":["話だけでも聞いてみようと思って行きました。"] };
const DUR={ "まだ1回目":["まだ1回目ですが、","1回目で"], "1か月くらい":["通い始めて1か月くらいですが、"], "2〜3か月":["2〜3か月通って、"], "半年以上":["半年ほど通って、","しばらく通ううちに、"] };
const FIRST_OK=["痛みがやわらいだ","歩くのがラクになった","階段がラクになった","立ち上がりがラクになった","膝の曲げ伸ばしがしやすくなった","気持ちが前向きになった","その他"];
function buildReview(){
  const rand=a=>a[Math.floor(Math.random()*a.length)];
  const chance=p=>Math.random()<p;
  const T=o=>o.t;
  const one=(k,M)=>{const o=sel[k]&&sel[k][0];return o&&M[o.t]?rand(M[o.t]):"";};
  // ① 状況
  const bui=sel.q1[0]?sel.q1[0].n:"膝";
  const woes=pickN(sel.q2.map(T),chance(0.15)?2:1).map(t=>rand(WOE[t]||["痛くて"]));
  const sit=bui+"が痛くて"+(woes.length?"、"+woes.join("、"):"");
  // ② これまで
  let prior="";
  const qp=sel.qp.map(T);
  if(qp.length&&chance(0.65)){
    const acts=pickN(qp.filter(t=>PRIOR[t]),2).map(t=>PRIOR[t]);
    if(acts.length) prior=acts.join("")+rand(["してきましたが、あまり変わりませんでした。","していましたが、思うようにはいきませんでした。","もしましたが、その場しのぎでした。"]);
    else if(qp.includes("我慢して様子を見ていた")) prior="ずっと我慢していました。";
    else prior="どうしたらいいのか分からずにいました。";
  }
  // ③ きっかけ＋気持ち（本人が選んだときだけ）
  const found=one("qk",FOUND), feel=one("qf",FEEL);
  const meet=(found&&chance(0.8)?found:"")+feel;
  // ④ 施術
  const treat=sel.q3.length&&chance(0.65)? rand(TREAT[pickN(sel.q3.map(T),1)[0]]||["施術してもらって"]) : "";
  // ⑤ 期間＋変化（1回目は、その場で感じる変化だけ）
  const first=sel.qd[0]&&sel.qd[0].t==="まだ1回目";
  const pool=first? sel.q4.map(T).filter(t=>FIRST_OK.includes(t)) : sel.q4.map(T);
  const chs=pickN(pool,!first&&chance(0.2)?2:1).map(t=>rand(CHANGE[t]||["少しずつラクになってきました"]));
  let change=(chs[0]||"体が少しラクになりました");
  if(chs[1]) change+="。それに"+chs[1];
  const bang=chance(0.25)?"！":"。";
  let dur=one("qd",DUR); if(!chs.length&&first) dur="まだ1回目ですが、";
  const lead=dur? dur : rand(["","今は","おかげで"]);
  const useTreat=treat&&!dur;
  const body=(useTreat? treat+"、" : lead)+change+bang;
  // ⑥ 良かった点
  const goods=pickN(sel.q5.map(T),chance(0.3)?2:1).map(t=>rand(GOOD[t]||["通ってよかったです"]));
  const good=goods.length?goods.join("。")+"。":"";
  const nayam=rand(["困っていました","悩んでいました"]);
  // 組み立て（毎回すべては使わない）
  const pats=[
    ()=>`${sit}${nayam}。${prior}${meet}${useTreat?"こちらで":""}${body}${good}`,
    ()=>`${sit}${nayam}。${meet||prior}${useTreat?"こちらで":""}${body}${good}`,
    ()=>`${sit}、こちらに通い始めました。${body}${good}`,
    ()=>`${good}${sit}${nayam}が、${body}`,
  ];
  let text=rand(pats)();
  const voice0=(sel.q6||"").trim();
  if(!voice0&&chance(0.35)) text+=rand(["おすすめです。","ありがとうございます。","先生ありがとうございます。"]);
  text=text.replace(BANNED,"").replace(/。。/g,"。").replace(/！。/g,"！").replace(/、、/g,"、");
  let voice=voice0; if(voice){if(!/[。！？!?）)】」』]$/.test(voice))voice+="。"; text+=voice;}
  return text;
}
function generateAndShow(){
  const text=buildReview();qArea.classList.add("hidden");rArea.classList.remove("hidden");
  document.getElementById("appTitle").innerHTML="口コミ文ができました";
  document.getElementById("appSub").innerHTML="気になるところは自由に直してから<br>投稿してくださいね";
  rArea.innerHTML=`<div class="result-box"><p class="result-lead">こちらの文章でいかがでしょうか。<br>そのままでも、書き換えても大丈夫です。</p><div class="result-text" id="reviewText" contenteditable="true" spellcheck="false">${text}</div><button class="regen" id="regenBtn">↻ 別の文章を作る</button><button class="copy" id="copyBtn">文章をコピーする</button><a class="goto main" id="gotoGoogle" href="${GOOGLE_REVIEW_URL}" target="_blank" rel="noopener">Googleに口コミを投稿する ›</a><a class="goto main hp" id="gotoHp" href="${HOTPEPPER_REVIEW_URL}" target="_blank" rel="noopener">ホットペッパービューティーに投稿する ›</a><div class="goto-note">どちらか一方でも、両方でもOKです</div><div class="steps-after"><b>かんたん3ステップ</b><br>① 上の「文章をコピーする」を押す<br>② 「Google」か「ホットペッパー」のボタンを押す<br>③ 投稿欄を長押しして<b>貼り付け</b> → 投稿</div></div>`;
  document.getElementById("regenBtn").onclick=()=>{document.getElementById("reviewText").textContent=buildReview();const c=document.getElementById("copyBtn");c.textContent="文章をコピーする";c.classList.remove("done");};
  document.getElementById("copyBtn").onclick=()=>{const t=document.getElementById("reviewText").innerText;const done=()=>{const c=document.getElementById("copyBtn");c.textContent="✓ コピーしました";c.classList.add("done");};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}else fallbackCopy(t,done);};
  window.scrollTo(0,0);
}
function fallbackCopy(t,done){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);done();}
/* 簡易コピーガード（同業対策・補助） */
document.addEventListener("contextmenu",e=>{if(e.target.id!=="reviewText"&&e.target.id!=="freeText")e.preventDefault();});
document.addEventListener("keydown",e=>{if(e.key==="F12")e.preventDefault();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="u")e.preventDefault();});
render();
</script>
